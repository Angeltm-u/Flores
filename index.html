<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🌻 Lluvia de Flores Amarillas 🌻</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(to bottom, #fffde7, #ffecb3);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: "Comic Sans MS", cursive, sans-serif;
    }

    h1 {
      color: #f57f17;
      text-shadow: 2px 2px #fff;
      font-size: 2.5rem;
      animation: latir 2s infinite;
      margin-bottom: 30px;
      z-index: 10;
    }

    @keyframes latir {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .flor {
      position: absolute;
      top: -100px;
      font-size: 2rem;
      animation: caer 6s linear infinite;
    }

    @keyframes caer {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <h1>🌻 Feliz Día de las Flores Amarillas 🌻</h1>

  <!-- Varias flores que caen -->
  <div class="flor" style="left:10%; animation-duration: 5s;">🌻</div>
  <div class="flor" style="left:25%; animation-duration: 6s;">🌻</div>
  <div class="flor" style="left:40%; animation-duration: 7s;">🌻</div>
  <div class="flor" style="left:55%; animation-duration: 4s;">🌻</div>
  <div class="flor" style="left:70%; animation-duration: 6.5s;">🌻</div>
  <div class="flor" style="left:85%; animation-duration: 5.5s;">🌻</div>
  <div class="flor" style="left:95%; animation-duration: 7s;">🌻</div>

  <script>
    // Generar flores infinitas 🌻
    function crearFlor() {
      const flor = document.createElement("div");
      flor.classList.add("flor");
      flor.innerText = "🌻";
      flor.style.left = Math.random() * 100 + "vw";
      flor.style.animationDuration = (4 + Math.random() * 4) + "s";
      flor.style.fontSize = (1.5 + Math.random() * 1.5) + "rem";
      document.body.appendChild(flor);

      setTimeout(() => {
        flor.remove();
      }, 8000);
    }

    setInterval(crearFlor, 500); // cada medio segundo nace una flor
  </script>
</body>
</html>
