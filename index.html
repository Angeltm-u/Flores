<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🌻 Para ti 🌻</title>

    <style>

        /* =========================================================
           CONFIGURACIÓN GENERAL
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Segoe UI", Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(255, 255, 180, 0.7),
                    transparent 30%
                ),
                linear-gradient(
                    180deg,
                    #fffde7 0%,
                    #fff8c5 35%,
                    #ffe082 70%,
                    #ffca28 100%
                );

            position: relative;
        }


        /* =========================================================
           LUZ DEL FONDO
        ========================================================= */

        .luz {
            position: absolute;

            width: 450px;
            height: 450px;

            border-radius: 50%;

            background: rgba(255, 235, 59, 0.35);

            filter: blur(60px);

            animation: respirar 5s ease-in-out infinite;

            z-index: 0;
        }

        @keyframes respirar {

            0%, 100% {
                transform: scale(1);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.2);
                opacity: 0.8;
            }
        }


        /* =========================================================
           ESTRELLAS / PARTICULAS
        ========================================================= */

        .particula {
            position: absolute;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: white;

            box-shadow:
                0 0 8px white,
                0 0 15px #fff59d;

            animation: parpadear 3s infinite ease-in-out;

            z-index: 1;
        }

        @keyframes parpadear {

            0%, 100% {
                opacity: 0.2;
                transform: scale(0.7);
            }

            50% {
                opacity: 1;
                transform: scale(1.3);
            }
        }


        /* =========================================================
           TARJETA CENTRAL
        ========================================================= */

        .contenedor {

            position: relative;

            width: min(90%, 650px);

            padding: 55px 40px;

            text-align: center;

            background: rgba(255, 255, 255, 0.45);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border: 2px solid rgba(255, 255, 255, 0.65);

            border-radius: 30px;

            box-shadow:
                0 20px 50px rgba(121, 85, 72, 0.2),
                inset 0 0 30px rgba(255, 255, 255, 0.4);

            z-index: 10;

            animation: aparecer 1.5s ease;
        }

        @keyframes aparecer {

            from {
                opacity: 0;
                transform: translateY(40px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        /* =========================================================
           TITULO
        ========================================================= */

        .titulo {

            font-size: clamp(2rem, 6vw, 4rem);

            color: #f57f17;

            text-shadow:
                2px 2px 0 white,
                0 0 15px rgba(255, 193, 7, 0.5);

            margin-bottom: 20px;

            animation: latir 3s ease-in-out infinite;
        }

        @keyframes latir {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }


        /* =========================================================
           SUBTITULO
        ========================================================= */

        .mensaje {

            font-size: clamp(1rem, 2.5vw, 1.3rem);

            color: #6d4c41;

            line-height: 1.7;

            margin-bottom: 30px;
        }


        /* =========================================================
           FLOR CENTRAL
        ========================================================= */

        .flor-central {

            font-size: 6rem;

            display: inline-block;

            filter:
                drop-shadow(0 10px 10px rgba(121, 85, 72, 0.25));

            animation:

                girar-suave 8s linear infinite,
                flotar 3s ease-in-out infinite;

        }

        @keyframes girar-suave {

            from {
                transform: rotate(-5deg);
            }

            50% {
                transform: rotate(5deg);
            }

            to {
                transform: rotate(-5deg);
            }
        }

        @keyframes flotar {

            0%, 100% {
                translate: 0 0;
            }

            50% {
                translate: 0 -12px;
            }
        }


        /* =========================================================
           CORAZONES
        ========================================================= */

        .corazon {

            position: absolute;

            font-size: 1.5rem;

            animation: subirCorazon linear forwards;

            z-index: 4;

            pointer-events: none;
        }

        @keyframes subirCorazon {

            0% {
                transform:
                    translateY(0)
                    scale(0.5)
                    rotate(0deg);

                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform:
                    translateY(-100vh)
                    scale(1.2)
                    rotate(30deg);

                opacity: 0;
            }
        }


        /* =========================================================
           FLORES QUE CAEN
        ========================================================= */

        .flor {

            position: absolute;

            top: -100px;

            z-index: 5;

            pointer-events: none;

            user-select: none;

            animation-name: caer;

            animation-timing-function: linear;

            animation-fill-mode: forwards;

            filter:
                drop-shadow(
                    0 5px 5px rgba(121, 85, 72, 0.2)
                );
        }

        @keyframes caer {

            0% {

                transform:
                    translateY(-100px)
                    translateX(0)
                    rotate(0deg);

                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            50% {

                transform:
                    translateY(50vh)
                    translateX(40px)
                    rotate(180deg);
            }

            100% {

                transform:
                    translateY(115vh)
                    translateX(-60px)
                    rotate(360deg);

                opacity: 0;
            }
        }


        /* =========================================================
           BOTÓN
        ========================================================= */

        .boton {

            border: none;

            padding: 14px 28px;

            border-radius: 50px;

            background: linear-gradient(
                135deg,
                #ffd54f,
                #ffb300
            );

            color: #5d4037;

            font-size: 1rem;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 20px rgba(245, 124, 0, 0.3);

            transition: all 0.3s ease;
        }

        .boton:hover {

            transform:
                translateY(-4px)
                scale(1.05);

            box-shadow:
                0 12px 30px rgba(245, 124, 0, 0.4);
        }

        .boton:active {

            transform: scale(0.95);
        }


        /* =========================================================
           TEXTO INFERIOR
        ========================================================= */

        .firma {

            margin-top: 25px;

            color: #8d6e63;

            font-size: 0.9rem;

            font-style: italic;
        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 600px) {

            .contenedor {
                padding: 40px 25px;
            }

            .flor-central {
                font-size: 4.5rem;
            }

            .mensaje {
                font-size: 1rem;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================================
         LUZ CENTRAL
    ========================================================== -->

    <div class="luz"></div>


    <!-- =========================================================
         PARTICULAS
    ========================================================== -->

    <div class="particula" style="left: 10%; top: 20%;"></div>
    <div class="particula" style="left: 20%; top: 70%; animation-delay: .5s;"></div>
    <div class="particula" style="left: 35%; top: 15%; animation-delay: 1s;"></div>
    <div class="particula" style="left: 50%; top: 80%; animation-delay: 1.5s;"></div>
    <div class="particula" style="left: 65%; top: 25%; animation-delay: 2s;"></div>
    <div class="particula" style="left: 80%; top: 60%; animation-delay: .8s;"></div>
    <div class="particula" style="left: 90%; top: 15%; animation-delay: 1.8s;"></div>


    <!-- =========================================================
         CONTENIDO PRINCIPAL
    ========================================================== -->

    <main class="contenedor">

        <div class="flor-central">
            🌻
        </div>

        <h1 class="titulo">
            Feliz Día de las<br>
            Flores Amarillas 🌻
        </h1>

        <p class="mensaje">
            Que nunca falten motivos para sonreír,
            momentos bonitos y alguien que haga
            florecer tus días. 💛
        </p>

        <button class="boton" onclick="crearCorazones()">
            🌻 Un pequeño detalle 🌻
        </button>

        <p class="firma">
            Hecho con cariño ✨
        </p>

    </main>


    <!-- =========================================================
         JAVASCRIPT
    ========================================================== -->

    <script>

        /*
         * ========================================================
         * CREAR UNA FLOR
         * ========================================================
         */

        function crearFlor() {

            const flor = document.createElement("div");

            flor.classList.add("flor");

            flor.textContent = "🌻";


            // Posición horizontal aleatoria

            flor.style.left =
                Math.random() * 100 + "vw";


            // Tamaño aleatorio

            const tamaño =
                1.2 + Math.random() * 2.2;

            flor.style.fontSize =
                tamaño + "rem";


            // Duración aleatoria

            const duracion =
                5 + Math.random() * 6;

            flor.style.animationDuration =
                duracion + "s";


            // Retraso aleatorio

            flor.style.animationDelay =
                Math.random() * 1.5 + "s";


            document.body.appendChild(flor);


            // Eliminar después de terminar

            setTimeout(() => {

                flor.remove();

            }, (duracion + 2) * 1000);

        }


        /*
         * ========================================================
         * LLUVIA CONTINUA DE FLORES
         * ========================================================
         */

        setInterval(crearFlor, 350);


        /*
         * Crear algunas flores inmediatamente
         */

        for (let i = 0; i < 15; i++) {

            setTimeout(
                crearFlor,
                i * 250
            );

        }


        /*
         * ========================================================
         * CORAZONES
         * ========================================================
         */

        function crearCorazon() {

            const corazon =
                document.createElement("div");

            corazon.classList.add("corazon");

            corazon.textContent =
                Math.random() > 0.5
                    ? "💛"
                    : "✨";


            corazon.style.left =
                Math.random() * 100 + "vw";


            corazon.style.top =
                "100vh";


            const tamaño =
                1 + Math.random() * 1.5;

            corazon.style.fontSize =
                tamaño + "rem";


            const duracion =
                3 + Math.random() * 3;

            corazon.style.animationDuration =
                duracion + "s";


            document.body.appendChild(corazon);


            setTimeout(() => {

                corazon.remove();

            }, duracion * 1000);

        }


        /*
         * Al presionar el botón,
         * aparecen muchos corazones
         */

        function lanzarCorazones() {

            for (let i = 0; i < 20; i++) {

                setTimeout(
                    crearCorazon,
                    i * 100
                );

            }

        }


        /*
         * Conectar el botón
         */

        function crearCorazones() {

            lanzarCorazones();

        }

    </script>

</body>

</html>
